    <script>
      lucide.createIcons();

      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const uiLayer = document.getElementById('ui-layer');
      const startBtn = document.getElementById('start-btn');
      const scoreDisplay = document.getElementById('score-display');
      const title = document.getElementById('title');
      const btnText = document.getElementById('btn-text');
      const img = document.getElementById('wave-sprite');

      const pauseBtnContainer = document.getElementById('pause-btn-container');
      const pauseBtn = document.getElementById('pause-btn');
      const pauseMenu = document.getElementById('pause-menu');
      const resumeBtn = document.getElementById('resume-btn');
      const quitToMenuBtn = document.getElementById('quit-to-menu-btn');

      // Audio Elements
      const bgMusic = document.getElementById('bg-music');
      const btnToggleMusic = document.getElementById('btn-toggle-music');
      let isMusicMuted = false;
      bgMusic.volume = 0.4; // Default volume

      let isPlaying = false;
      let isPaused = false;
      let isDead = false;
      let isHolding = false;
      let gameSpeedMultiplier = 1;
      let score = 0;
      let animationId;
      let frameCount = 0;

      let gameSettings = {
          showFPS: false,
          reduceLag: false,
          noclip: false,
          speedhack: false,
          freeMode: false,
          autoplay: false
      };
      let mousePos = { y: window.innerHeight / 2 };

      // Default theme color (white)
      let themeColor = '#ffffff';
      const colorSelector = document.getElementById('color-selector');
      if (colorSelector) {
          // Ensure UI selection reflects default
          Array.from(colorSelector.children).forEach(btn => {
              if (btn.tagName === 'BUTTON') {
                  btn.classList.remove('border-white');
                  btn.classList.add('border-transparent');
              }
          });
          const defaultBtn = colorSelector.querySelector('button[data-color="#ffffff"]');
          if (defaultBtn) {
              defaultBtn.classList.remove('border-transparent');
              defaultBtn.classList.add('border-white');
          }

          colorSelector.addEventListener('click', (e) => {
              if (e.target.tagName === 'BUTTON') {
                  themeColor = e.target.getAttribute('data-color');
                  Array.from(colorSelector.children).forEach(btn => {
                      btn.classList.remove('border-white');
                      btn.classList.add('border-transparent');
                  });
                  e.target.classList.remove('border-transparent');
                  e.target.classList.add('border-white');
              }
          });
      }

      let currentMode = 'medium';
      const MODES = {
          easy: { speed: 5, gap: 280, spawnRate: 90 },
          medium: { speed: 7, gap: 220, spawnRate: 75 },
          hard: { speed: 9, gap: 160, spawnRate: 60 }
      };

      let WAVE_SPEED = MODES.medium.speed;
      let FORWARD_SPEED = MODES.medium.speed;
      const OBSTACLE_WIDTH = 70;
      let OBSTACLE_GAP = MODES.medium.gap;
      let SPAWN_RATE = MODES.medium.spawnRate;

      const modeButtons = {
          easy: document.getElementById('mode-easy'),
          medium: document.getElementById('mode-medium'),
          hard: document.getElementById('mode-hard')
      };

      function setMode(mode) {
          if(isPlaying) return;
          currentMode = mode;
          const config = MODES[mode];
          FORWARD_SPEED = config.speed;
          WAVE_SPEED = config.speed;
          OBSTACLE_GAP = config.gap;

          Object.values(modeButtons).forEach(btn => {
              if(!btn) return;
              btn.className = 'px-4 py-2 rounded-md bg-neutral-800 text-neutral-400 border border-neutral-700 hover:text-white transition-colors text-sm';
          });

          if(modeButtons[mode]) {
              modeButtons[mode].className = 'px-4 py-2 rounded-md bg-white text-neutral-950 font-medium border border-white transition-colors text-sm';
          }
      }

      if(modeButtons.easy) modeButtons.easy.addEventListener('click', () => setMode('easy'));
      if(modeButtons.medium) modeButtons.medium.addEventListener('click', () => setMode('medium'));
      if(modeButtons.hard) modeButtons.hard.addEventListener('click', () => setMode('hard'));

      let currentWaveSize = 'normal';
      const WAVE_SIZES = {
          normal: { size: 24, imgSize: 48 },
          mini: { size: 12, imgSize: 24 }
      };

      const sizeButtons = {
          normal: document.getElementById('size-normal'),
          mini: document.getElementById('size-mini')
      };

      function setWaveSize(size) {
          if(isPlaying) return;
          currentWaveSize = size;
          player.size = WAVE_SIZES[size].size;
          player.imgSize = WAVE_SIZES[size].imgSize;

          Object.values(sizeButtons).forEach(btn => {
              if(!btn) return;
              btn.className = 'px-4 py-2 rounded-md bg-neutral-800 text-neutral-400 border border-neutral-700 hover:text-white transition-colors text-sm';
          });

          if(sizeButtons[size]) {
              sizeButtons[size].className = 'px-4 py-2 rounded-md bg-white text-neutral-950 font-medium border border-white transition-colors text-sm';
          }
      }

      if(sizeButtons.normal) sizeButtons.normal.addEventListener('click', () => setWaveSize('normal'));
      if(sizeButtons.mini) sizeButtons.mini.addEventListener('click', () => setWaveSize('mini'));

      let player = {
          x: 200,
          y: 0,
          size: WAVE_SIZES.normal.size,
          imgSize: WAVE_SIZES.normal.imgSize,
          angle: Math.PI / 2
      };

      let obstacles = [];
      let trail = [];
      let particles = [];

      function resizeCanvas() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          player.x = Math.max(200, canvas.width * 0.2);
          if(!isPlaying && player.y === 0) {
              player.y = canvas.height / 2;
          }
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      function initGame(speedMultiplier = 1) {
          player.y = canvas.height / 2;
          player.angle = Math.PI / 2;
          obstacles = [];
          trail = [];
          particles = [];
          score = 0;
          frameCount = 0;
          SPAWN_RATE = MODES[currentMode].spawnRate;
          isPlaying = true;
          isPaused = false;
          isDead = false;
          isHolding = false;
          gameSpeedMultiplier = speedMultiplier;

          // Start Music
          bgMusic.currentTime = 0;
          if (!isMusicMuted) {
              bgMusic.play().catch(e => console.log("Audio autoplay prevented"));
          }

          uiLayer.style.opacity = '0';
          setTimeout(() => uiLayer.classList.add('hidden'), 300);

          pauseBtnContainer.classList.remove('hidden');
          setTimeout(() => pauseBtnContainer.style.opacity = '1', 10);

          scoreDisplay.textContent = '0';
          scoreDisplay.style.transform = 'scale(1)';

          cancelAnimationFrame(animationId);
          loop();
      }

      function createExplosion(x, y) {
          particles = [];
          for(let i=0; i<15; i++) {
              particles.push({
                  x: x, y: y,
                  vx: (Math.random() - 0.5) * 20,
                  vy: (Math.random() - 0.5) * 20,
                  va: (Math.random() - 0.5) * 0.5,
                  angle: Math.random() * Math.PI * 2,
                  life: 1.0 + Math.random() * 0.2,
                  color: '#ffffff',
                  size: Math.random() * 8 + 4
              });
          }
          for(let i=0; i<25; i++) {
              particles.push({
                  x: x, y: y,
                  vx: (Math.random() - 0.5) * 30,
                  vy: (Math.random() - 0.5) * 30,
                  va: (Math.random() - 0.5) * 0.5,
                  angle: Math.random() * Math.PI * 2,
                  life: 1.0 + Math.random() * 0.5,
                  color: themeColor,
                  size: Math.random() * 12 + 4
              });
          }
      }

      function die() {
          isDead = true;
          isHolding = false;
          bgMusic.pause(); // Stop music on death
          createExplosion(player.x, player.y);

          canvas.style.transform = 'translate(10px, 10px)';
          setTimeout(() => canvas.style.transform = 'translate(-10px, -10px)', 50);
          setTimeout(() => canvas.style.transform = 'translate(10px, -10px)', 100);
          setTimeout(() => canvas.style.transform = 'translate(0, 0)', 150);

          pauseBtnContainer.style.opacity = '0';

          setTimeout(() => {
              if (isPlaying && isDead) {
                  initGame(1);
              }
          }, 800);
      }

      function togglePause(newMultiplier = null) {
          if (!isPlaying || isDead) return;

          if (isPaused) {
              isPaused = false;
              if (newMultiplier !== null) {
                  gameSpeedMultiplier = newMultiplier;
              }
              if (!isMusicMuted) bgMusic.play().catch(e => e); // Resume music

              pauseMenu.style.opacity = '0';
              setTimeout(() => pauseMenu.classList.add('hidden'), 300);
              pauseBtnContainer.style.opacity = '1';
              lastTime = performance.now();
              loop();
          } else {
              isPaused = true;
              bgMusic.pause(); // Pause music

              pauseBtnContainer.style.opacity = '0';
              pauseMenu.classList.remove('hidden');
              setTimeout(() => pauseMenu.style.opacity = '1', 10);
              cancelAnimationFrame(animationId);
          }
      }

      pauseBtn.addEventListener('click', () => togglePause());

      const toggleAutoplayPause = document.getElementById('toggle-autoplay-pause');
      if (toggleAutoplayPause) {
          toggleAutoplayPause.addEventListener('change', (e) => {
              gameSettings.autoplay = e.target.checked;
          });
      }

      quitToMenuBtn.addEventListener('click', () => {
          isPaused = false;
          isPlaying = false;
          isDead = false;

          // Reset the canvas to a fresh state, just like after a page refresh.
          obstacles = [];
          trail = [];
          particles = [];
          score = 0;
          frameCount = 0;
          SPAWN_RATE = MODES[currentMode].spawnRate;
          scoreDisplay.textContent = '0';
          player.y = canvas.height / 2;
          player.angle = Math.PI / 2;
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          bgMusic.pause();
          bgMusic.currentTime = 0;

          // Disable the Autoplay Bot when quitting to menu.
          var autoplayCheckbox = document.getElementById('toggle-autoplay-pause');
          if (autoplayCheckbox) {
              autoplayCheckbox.checked = false;
              autoplayCheckbox.dispatchEvent(new Event('change'));
          }
          gameSettings.autoplay = false;
          isHolding = false;

          cancelAnimationFrame(animationId);
          pauseMenu.style.opacity = '0';
          setTimeout(() => pauseMenu.classList.add('hidden'), 300);
          pauseBtnContainer.style.opacity = '0';
          setTimeout(() => pauseBtnContainer.classList.add('hidden'), 300);

          uiLayer.classList.remove('hidden');
          setTimeout(() => uiLayer.style.opacity = '1', 10);
          title.textContent = 'Wave Dash';
          lucide.createIcons();
      });

      function handleInputStart(e) {
          if(e.type === 'mousedown' && e.button !== 0) return;
          if(e.target.closest('#ui-layer') || e.target.closest('#pause-menu') || e.target.closest('#pause-btn')) return;
          if(isPaused || isDead) return;
          if(!gameSettings.autoplay) isHolding = true;
      }

      function handleInputEnd() {
          if(!gameSettings.autoplay) isHolding = false;
      }

      window.addEventListener('keydown', (e) => {
          if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
              e.preventDefault();
              if (isPaused) return;
              if(!isPlaying && uiLayer.classList.contains('hidden') === false) {
                   initGame(1);
              } else {
                  if(!isDead && !gameSettings.autoplay) isHolding = true;
              }
          }
          if (e.code === 'Escape' || e.code === 'KeyP') {
              if ((isPlaying && !isDead) || isPaused) {
                  togglePause();
              }
          }
      });

      window.addEventListener('keyup', (e) => {
          if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
              if(!gameSettings.autoplay) isHolding = false;
          }
      });

      window.addEventListener('mousemove', e => mousePos.y = e.clientY);
      window.addEventListener('touchmove', e => {
          if (gameSettings.freeMode) mousePos.y = e.touches[0].clientY;
      }, { passive: true });

      window.addEventListener('mousedown', handleInputStart);
      window.addEventListener('mouseup', handleInputEnd);
      window.addEventListener('touchstart', (e) => {
          if(!e.target.closest('#ui-layer') && !e.target.closest('#pause-menu') && !e.target.closest('#pause-btn')) e.preventDefault();
          handleInputStart(e);
      }, { passive: false });
      window.addEventListener('touchend', handleInputEnd);

      startBtn.addEventListener('click', () => {
          if (!isPlaying) initGame(1);
      });

      resumeBtn.addEventListener('click', () => {
          if (isPaused) togglePause();
      });

      function drawPlayer() {
          ctx.save();
          ctx.translate(player.x, player.y);

          let targetAngle = isHolding ? Math.PI / 4 : (Math.PI * 3) / 4;
          if(currentWaveSize === 'mini') {
              targetAngle = isHolding ? Math.PI / 6 : (Math.PI * 5) / 6;
          }

          const minY = 30 + player.size / 2;
          const maxY = canvas.height - 30 - player.size / 2;
          if (player.y <= minY || player.y >= maxY) {
              targetAngle = Math.PI / 2;
          }

          if (gameSettings.freeMode && !gameSettings.autoplay) {
              targetAngle = Math.PI / 2;
          }

          player.angle += (targetAngle - player.angle) * 0.15;
          ctx.rotate(player.angle);

          if (img.complete && img.naturalHeight !== 0) {
              ctx.drawImage(img, -player.imgSize/2, -player.imgSize/2, player.imgSize, player.imgSize);
          }
          ctx.restore();
      }

      function drawTrail() {
          if (trail.length < 2) return;
          ctx.save();

          if (!gameSettings.reduceLag) {
              ctx.shadowColor = themeColor;
              ctx.shadowBlur = 15;
          }

          ctx.beginPath();
          ctx.globalAlpha = 0.9;
          ctx.strokeStyle = themeColor;
          ctx.lineWidth = player.size === 12 ? 8 : 14;
          ctx.lineCap = 'butt';
          ctx.lineJoin = 'miter';
          ctx.moveTo(trail[0].x, trail[0].y);
          for(let i=1; i<trail.length; i++) {
              ctx.lineTo(trail[i].x, trail[i].y);
          }
          ctx.stroke();
          ctx.globalAlpha = 1.0;

          if (!gameSettings.reduceLag) {
              ctx.shadowBlur = 5;
          } else {
              ctx.shadowBlur = 0;
          }

          ctx.beginPath();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = player.size === 12 ? 3 : 5;
          ctx.lineCap = 'butt';
          ctx.lineJoin = 'miter';
          ctx.moveTo(trail[0].x, trail[0].y);
          for(let i=1; i<trail.length; i++) {
              ctx.lineTo(trail[i].x, trail[i].y);
          }
          ctx.stroke();

          ctx.restore();
      }

      function drawParticles() {
          for(let i=particles.length-1; i>=0; i--) {
              let p = particles[i];
              p.x += p.vx;
              p.y += p.vy;
              p.vx *= 0.92;
              p.vy *= 0.92;
              p.life -= 0.025;
              p.angle += p.va;

              if(p.life <= 0) {
                  particles.splice(i, 1);
                  continue;
              }

              ctx.save();
              ctx.globalAlpha = Math.max(0, p.life);
              if (!gameSettings.reduceLag) {
                  ctx.shadowColor = p.color;
                  ctx.shadowBlur = 10;
              }
              ctx.fillStyle = p.color;
              ctx.translate(p.x, p.y);
              ctx.rotate(p.angle);
              ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
              ctx.restore();
          }
      }

      function drawEnvironment() {
          ctx.strokeStyle = '#171717';
          ctx.lineWidth = 1;
          const gridSize = 100;
          const activeForwardSpeed = (gameSettings.speedhack ? FORWARD_SPEED * 1.5 : FORWARD_SPEED) * gameSpeedMultiplier;
          const offset = isDead ? 0 : (frameCount * activeForwardSpeed) % gridSize;

          ctx.beginPath();
          for(let i = -offset; i < canvas.width; i += gridSize) {
              ctx.moveTo(i, 0);
              ctx.lineTo(i, canvas.height);
          }
          ctx.stroke();

          ctx.fillStyle = '#171717';
          ctx.fillRect(0, 0, canvas.width, 30);
          ctx.fillRect(0, canvas.height - 30, canvas.width, 30);

          ctx.fillStyle = '#262626';
          ctx.fillRect(0, 28, canvas.width, 2);
          ctx.fillRect(0, canvas.height - 30, canvas.width, 2);

          obstacles.forEach(obs => {
              if (gameSettings.reduceLag) {
                  ctx.fillStyle = '#262626';
                  ctx.shadowBlur = 0;
              } else {
                  const grad = ctx.createLinearGradient(obs.x, 0, obs.x + OBSTACLE_WIDTH, 0);
                  grad.addColorStop(0, '#171717');
                  grad.addColorStop(0.5, '#262626');
                  grad.addColorStop(1, '#171717');
                  ctx.fillStyle = grad;
                  ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                  ctx.shadowBlur = 10;
              }
              ctx.strokeStyle = '#333333';
              ctx.lineWidth = 2;

              ctx.beginPath();
              if (ctx.roundRect) {
                  ctx.roundRect(obs.x, 0, OBSTACLE_WIDTH, obs.topHeight, [0, 0, 8, 8]);
              } else {
                  ctx.rect(obs.x, 0, OBSTACLE_WIDTH, obs.topHeight);
              }
              ctx.fill();
              ctx.stroke();

              const bottomHeight = canvas.height - obs.topHeight - OBSTACLE_GAP;
              ctx.beginPath();
              if (ctx.roundRect) {
                  ctx.roundRect(obs.x, obs.topHeight + OBSTACLE_GAP, OBSTACLE_WIDTH, bottomHeight, [8, 8, 0, 0]);
              } else {
                  ctx.rect(obs.x, obs.topHeight + OBSTACLE_GAP, OBSTACLE_WIDTH, bottomHeight);
              }
              ctx.fill();
              ctx.stroke();

              if (!gameSettings.reduceLag) {
                  ctx.shadowColor = themeColor;
                  ctx.shadowBlur = 15;
              }
              ctx.fillStyle = themeColor;

              ctx.beginPath();
              if (ctx.roundRect) {
                  ctx.roundRect(obs.x + 2, obs.topHeight - 8, OBSTACLE_WIDTH - 4, 6, [4, 4, 4, 4]);
              } else {
                  ctx.fillRect(obs.x + 2, obs.topHeight - 8, OBSTACLE_WIDTH - 4, 6);
              }
              ctx.fill();

              ctx.beginPath();
              if (ctx.roundRect) {
                  ctx.roundRect(obs.x + 2, obs.topHeight + OBSTACLE_GAP + 2, OBSTACLE_WIDTH - 4, 6, [4, 4, 4, 4]);
              } else {
                  ctx.fillRect(obs.x + 2, obs.topHeight + OBSTACLE_GAP + 2, OBSTACLE_WIDTH - 4, 6);
              }
              ctx.fill();

              ctx.shadowBlur = 0;
          });
      }

      function update() {
          const currentWaveSpeed = (currentWaveSize === 'mini' ? WAVE_SPEED * 2.3 : WAVE_SPEED) * gameSpeedMultiplier;
          const activeForwardSpeed = (gameSettings.speedhack ? FORWARD_SPEED * 1.5 : FORWARD_SPEED) * gameSpeedMultiplier;

          if (gameSettings.autoplay && !isDead) {
              let nextObs = obstacles.find(obs => obs.x + OBSTACLE_WIDTH > player.x - player.size);
              let targetY = canvas.height / 2;
              if (nextObs) {
                  targetY = nextObs.topHeight + (OBSTACLE_GAP / 2);
              }
              isHolding = player.y > targetY;
          }

          if (gameSettings.freeMode && !gameSettings.autoplay) {
              player.y += (mousePos.y - player.y) * 0.15;
          } else {
              if (isHolding) {
                  player.y -= currentWaveSpeed;
              } else {
                  player.y += currentWaveSpeed;
              }
          }

          const minY = 30 + player.size / 2;
          const maxY = canvas.height - 30 - player.size / 2;
          if (player.y < minY) player.y = minY;
          if (player.y > maxY) player.y = maxY;

          trail.push({x: player.x, y: player.y});
          trail.forEach(t => t.x -= activeForwardSpeed);

          let maxTrail = gameSettings.reduceLag ? 20 : 80;
          if(trail.length > maxTrail) trail.shift();

          let currentSpawnRate = Math.max(10, SPAWN_RATE - (gameSettings.speedhack ? 20 : 0));
          currentSpawnRate = Math.max(5, Math.floor(currentSpawnRate / gameSpeedMultiplier));

          if (frameCount % currentSpawnRate === 0) {
              const minHeight = 50;
              const maxTopHeight = canvas.height - OBSTACLE_GAP - minHeight - 60;
              const topHeight = Math.floor(Math.random() * (maxTopHeight - minHeight + 1) + minHeight);

              obstacles.push({
                  x: canvas.width,
                  topHeight: topHeight,
                  passed: false
              });

              if(SPAWN_RATE > 45 && frameCount % 500 === 0) {
                  SPAWN_RATE -= 2;
              }
          }

          for (let i = obstacles.length - 1; i >= 0; i--) {
              let obs = obstacles[i];
              obs.x -= activeForwardSpeed;

              if (!obs.passed && obs.x + OBSTACLE_WIDTH < player.x) {
                  score++;
                  scoreDisplay.textContent = score;
                  obs.passed = true;
                  scoreDisplay.style.transform = 'scale(1.2)';
                  setTimeout(() => scoreDisplay.style.transform = 'scale(1)', 100);
              }

              if (obs.x + OBSTACLE_WIDTH < -100) {
                  obstacles.splice(i, 1);
              }
          }

          frameCount++;
      }

      function checkCollisions() {
          if (gameSettings.noclip || isDead) return;

          const hitBox = player.size * 0.55;

          for (let obs of obstacles) {
              if (player.x + hitBox > obs.x && player.x - hitBox < obs.x + OBSTACLE_WIDTH) {
                  if (player.y - hitBox < obs.topHeight || player.y + hitBox > obs.topHeight + OBSTACLE_GAP) {
                      die();
                      return;
                  }
              }
          }
      }

      let lastTime = performance.now();
      let framesCount = 0;
      let lastFpsDisplay = 0;

      function loop() {
          if (!isPlaying || isPaused) return;

          ctx.fillStyle = '#0a0a0a';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          if (!isDead) {
              update();
              checkCollisions();
          }

          drawEnvironment();

          if (!isDead) {
              drawTrail();
              drawPlayer();
          } else {
              drawParticles();
          }

          if (gameSettings.showFPS) {
              framesCount++;
              const now = performance.now();
              if (now - lastTime >= 1000) {
                  lastFpsDisplay = framesCount;
                  framesCount = 0;
                  lastTime = now;
              }
              ctx.fillStyle = '#00ff00';
              ctx.font = 'bold 16px monospace';
              ctx.textAlign = 'left';
              ctx.textBaseline = 'top';
              ctx.fillText(`FPS: ${lastFpsDisplay}`, 20, 20);
          }

          if (isPlaying && !isPaused) {
              animationId = requestAnimationFrame(loop);
          }
      }
    </script>

    <script>
      (function() {
          const toggleTrailSize = document.getElementById('toggle-trail-size');
          const trailSizeContainer = document.getElementById('trail-size-container');
          const trailSizeSlider = document.getElementById('trail-size-slider');
          const trailSizeDisplay = document.getElementById('trail-size-display');

          const miniTrailSizeSlider = document.getElementById('mini-trail-size-slider');
          const miniTrailSizeDisplay = document.getElementById('mini-trail-size-display');

          const toggleSolidTrail = document.getElementById('toggle-solid-trail');

          if (typeof gameSettings !== 'undefined') {
              gameSettings.customTrailSize = false;
              gameSettings.trailSizeValue = 14;
              gameSettings.customMiniTrailSize = false;
              gameSettings.miniTrailSizeValue = 8;
              gameSettings.solidTrail = false;
          }

          if (toggleSolidTrail) {
              toggleSolidTrail.addEventListener('change', (e) => {
                  if (typeof gameSettings !== 'undefined') {
                      gameSettings.solidTrail = e.target.checked;
                  }
              });
          }

          if (toggleTrailSize) {
              toggleTrailSize.addEventListener('change', (e) => {
                  if (typeof gameSettings !== 'undefined') {
                      gameSettings.customTrailSize = e.target.checked;
                      gameSettings.customMiniTrailSize = e.target.checked;
                  }
                  if(e.target.checked) {
                      trailSizeContainer.classList.remove('hidden');
                      setTimeout(() => trailSizeContainer.classList.remove('opacity-0'), 10);
                  } else {
                      trailSizeContainer.classList.add('opacity-0');
                      setTimeout(() => trailSizeContainer.classList.add('hidden'), 300);
                  }
              });
          }

          if (trailSizeSlider) {
              trailSizeSlider.addEventListener('input', (e) => {
                  if (typeof gameSettings !== 'undefined') {
                      gameSettings.trailSizeValue = parseInt(e.target.value);
                  }
                  if (trailSizeDisplay) trailSizeDisplay.textContent = e.target.value;
              });
          }

          if (miniTrailSizeSlider) {
              miniTrailSizeSlider.addEventListener('input', (e) => {
                  if (typeof gameSettings !== 'undefined') {
                      gameSettings.miniTrailSizeValue = parseInt(e.target.value);
                  }
                  if (miniTrailSizeDisplay) miniTrailSizeDisplay.textContent = e.target.value;
              });
          }

          if (typeof drawTrail === 'function') {
              drawTrail = function() {
                  if (trail.length < 2) return;
                  ctx.save();

                  if (!gameSettings.reduceLag) {
                      ctx.shadowColor = themeColor;
                      ctx.shadowBlur = 15;
                  }

                  let baseWidth = player.size === 12 ? 8 : 14;
                  if (player.size === 12 && gameSettings.customMiniTrailSize) {
                      baseWidth = gameSettings.miniTrailSizeValue;
                  } else if (player.size !== 12 && gameSettings.customTrailSize) {
                      baseWidth = gameSettings.trailSizeValue;
                  }

                  ctx.beginPath();
                  ctx.globalAlpha = 0.9;
                  ctx.strokeStyle = themeColor;
                  ctx.lineWidth = baseWidth;
                  ctx.lineCap = 'butt';
                  ctx.lineJoin = 'miter';
                  ctx.moveTo(trail[0].x, trail[0].y);
                  for(let i=1; i<trail.length; i++) {
                      ctx.lineTo(trail[i].x, trail[i].y);
                  }
                  ctx.stroke();
                  ctx.globalAlpha = 1.0;

                  if (!gameSettings.reduceLag) {
                      ctx.shadowBlur = 5;
                  } else {
                      ctx.shadowBlur = 0;
                  }

                  if (!gameSettings.solidTrail) {
                      ctx.beginPath();
                      ctx.strokeStyle = '#ffffff';
                      ctx.lineWidth = Math.max(1, baseWidth * (player.size === 12 ? 3/8 : 5/14));
                      ctx.lineCap = 'butt';
                      ctx.lineJoin = 'miter';
                      ctx.moveTo(trail[0].x, trail[0].y);
                      for(let i=1; i<trail.length; i++) {
                          ctx.lineTo(trail[i].x, trail[i].y);
                      }
                      ctx.stroke();
                  }

                  ctx.restore();
              };
          }
      })();

    <script>
      (function() {
          const colorOneInput = document.getElementById('wave-icon-color-1');
          const colorTwoInput = document.getElementById('wave-icon-color-2');
          const waveSprite = document.getElementById('wave-sprite');
          const preview = document.getElementById('icon-kit-preview');
          const optionButtons = document.querySelectorAll('.icon-option');
          let selectedIcon = 'wave';
          let recolorTimer;

          function hexToRgb(hex) {
              const value = parseInt(hex.slice(1), 16);
              return {
                  r: (value >> 16) & 255,
                  g: (value >> 8) & 255,
                  b: value & 255
              };
          }

          function recolorSelectedIcon() {
              if (!colorOneInput || !colorTwoInput || !waveSprite || typeof ICONS === 'undefined') return;
              const source = ICONS[selectedIcon];
              if (!source) return;

              const sourceImage = new Image();
              sourceImage.crossOrigin = 'anonymous';
              sourceImage.onload = function() {
                  const recolorCanvas = document.createElement('canvas');
                  recolorCanvas.width = sourceImage.naturalWidth;
                  recolorCanvas.height = sourceImage.naturalHeight;
                  const recolorContext = recolorCanvas.getContext('2d');
                  recolorContext.drawImage(sourceImage, 0, 0);

                  try {
                      const imageData = recolorContext.getImageData(0, 0, recolorCanvas.width, recolorCanvas.height);
                      const pixels = imageData.data;
                      const colorOne = hexToRgb(colorOneInput.value);
                      const colorTwo = hexToRgb(colorTwoInput.value);

                      for (let i = 0; i < pixels.length; i += 4) {
                          if (pixels[i + 3] === 0) continue;
                          const luminance = (pixels[i] * 0.299) + (pixels[i + 1] * 0.587) + (pixels[i + 2] * 0.114);
                          const chosenColor = luminance >= 128 ? colorOne : colorTwo;
                          pixels[i] = chosenColor.r;
                          pixels[i + 1] = chosenColor.g;
                          pixels[i + 2] = chosenColor.b;
                      }

                      recolorContext.putImageData(imageData, 0, 0);
                      const recoloredSource = recolorCanvas.toDataURL('image/png');
                      waveSprite.src = recoloredSource;
                      if (preview) preview.src = recoloredSource;
                  } catch (error) {
                      waveSprite.src = source;
                      if (preview) preview.src = source;
                  }
              };
              sourceImage.src = source;
          }

          function scheduleRecolor() {
              clearTimeout(recolorTimer);
              recolorTimer = setTimeout(recolorSelectedIcon, 30);
          }

          if (colorOneInput) colorOneInput.addEventListener('input', scheduleRecolor);
          if (colorTwoInput) colorTwoInput.addEventListener('input', scheduleRecolor);

          optionButtons.forEach(button => {
              button.addEventListener('click', function() {
                  selectedIcon = button.dataset.icon || 'wave';
                  scheduleRecolor();
              });
          });

          recolorSelectedIcon();
      })();
    </script>

    <script>
      (function() {
          const autoplayToggle = document.getElementById('toggle-autoplay-pause');
          if (!autoplayToggle) return;

          let smartAutoplayEnabled = autoplayToggle.checked;
          let lastDecision = false;

          autoplayToggle.addEventListener('change', function(e) {
              smartAutoplayEnabled = e.target.checked;
              gameSettings.autoplay = false;
              if (!smartAutoplayEnabled) isHolding = false;
          });

          function clamp(value, min, max) {
              return Math.max(min, Math.min(max, value));
          }

          function smartBotThink() {
              if (smartAutoplayEnabled && typeof gameSettings !== 'undefined') {
                  gameSettings.autoplay = false;

                  if (isPlaying && !isPaused && !isDead) {
                      const forwardSpeed = ((gameSettings.speedhack ? FORWARD_SPEED * 1.5 : FORWARD_SPEED) * gameSpeedMultiplier) || 1;
                      const verticalSpeed = ((currentWaveSize === 'mini' ? WAVE_SPEED * 2.3 : WAVE_SPEED) * gameSpeedMultiplier) || 1;

                      const upcoming = obstacles
                          .filter(function(obstacle) {
                              return obstacle.x + OBSTACLE_WIDTH > player.x - player.size;
                          })
                          .sort(function(a, b) {
                              return a.x - b.x;
                          });

                      let nextDecision = lastDecision;

                      if (upcoming.length > 0) {
                          const obs = upcoming[0];
                          const hitbox = player.size * 0.55;
                          const safety = hitbox + 12;

                          const topBound = obs.topHeight + safety;
                          const bottomBound = obs.topHeight + OBSTACLE_GAP - safety;

                          let targetY = (topBound + bottomBound) / 2;

                          if (upcoming.length > 1) {
                              const obs2 = upcoming[1];
                              const topBound2 = obs2.topHeight + safety;
                              const bottomBound2 = obs2.topHeight + OBSTACLE_GAP - safety;
                              const targetY2 = (topBound2 + bottomBound2) / 2;

                              if (player.x > obs.x) {
                                  targetY = targetY2;
                              } else {
                                  const dist = Math.max(0, obs.x - player.x);
                                  const blendWeight = Math.max(0, Math.min(1, 1 - (dist / 400)));
                                  targetY = targetY * (1 - blendWeight) + targetY2 * blendWeight;
                              }
                          }

                          // No deadzone, allow spamming
                          const deadzone = 0;

                          if (player.y > targetY + deadzone) {
                              nextDecision = true;
                          } else if (player.y < targetY - deadzone) {
                              nextDecision = false;
                          }

                          const currentSlope = nextDecision ? -1 : 1;

                          let distToFront = Math.max(0, obs.x - player.x);
                          let projectedEnterY = player.y + (distToFront / forwardSpeed) * verticalSpeed * currentSlope;

                          let distToBack = Math.max(0, (obs.x + OBSTACLE_WIDTH) - player.x);
                          let projectedExitY = player.y + (distToBack / forwardSpeed) * verticalSpeed * currentSlope;

                          if (nextDecision) {
                              if (projectedEnterY < topBound || projectedExitY < topBound) {
                                  nextDecision = false;
                              }
                          } else {
                              if (projectedEnterY > bottomBound || projectedExitY > bottomBound) {
                                  nextDecision = true;
                              }
                          }

                          if (player.y <= topBound + 10) nextDecision = false;
                          if (player.y >= bottomBound - 10) nextDecision = true;

                      } else {
                          const centerTarget = canvas.height / 2;
                          if (player.y > centerTarget + 50) nextDecision = true;
                          else if (player.y < centerTarget - 50) nextDecision = false;
                      }

                      const absMinY = 30 + player.size / 2 + 15;
                      const absMaxY = canvas.height - 30 - player.size / 2 - 15;
                      if (player.y <= absMinY) nextDecision = false;
                      if (player.y >= absMaxY) nextDecision = true;

                      // Instant reaction for optimal spamming if needed
                      lastDecision = nextDecision;
                      isHolding = nextDecision;
                  }
              }
          }

          const existingUpdate = window.update;
          window.update = function() {
              smartBotThink();
              if (existingUpdate) {
                  existingUpdate.apply(this, arguments);
              }
          };
      })();
    </script>

    <script>
      // Past scores (localStorage cache) + Top-100 leaderboard + triple-Ctrl autoplay reveal.
      (function() {
          var SCORES_KEY = 'wave-dash-past-scores';

          // One unique random name per user, kept in localStorage.
          var PLAYER_NAME_KEY = 'wave-dash-player-name';
          var NAME_PART_A = ['Nova','Blaze','Turbo','Cosmic','Neon','Shadow','Frost','Thunder','Pixel','Ghost','Iron','Crimson','Silver','Rapid','Mystic','Electric'];
          var NAME_PART_B = ['Rider','Dash','Wave','Surfer','Pilot','Runner','Glider','Storm','Wolf','Falcon','Tiger','Bolt','Drift','Vortex','Blade','Comet'];
          function getPlayerName() {
              try {
                  var saved = localStorage.getItem(PLAYER_NAME_KEY);
                  if (saved) return saved;
              } catch (e) {}
              var fresh = NAME_PART_A[Math.floor(Math.random() * NAME_PART_A.length)] + NAME_PART_B[Math.floor(Math.random() * NAME_PART_B.length)] + (10 + Math.floor(Math.random() * 90));
              try { localStorage.setItem(PLAYER_NAME_KEY, fresh); } catch (e) {}
              return fresh;
          }
          var PLAYER_NAME = getPlayerName();
          var playerNameLabel = document.getElementById('player-name-label');
          if (playerNameLabel) playerNameLabel.textContent = PLAYER_NAME;

          function loadPastScores() {
              try {
                  var parsed = JSON.parse(localStorage.getItem(SCORES_KEY) || '[]');
                  if (Array.isArray(parsed)) {
                      return parsed.filter(function(n) { return typeof n === 'number' && isFinite(n); });
                  }
              } catch (e) {}
              return [];
          }

          function savePastScore(value) {
              if (typeof value !== 'number' || !isFinite(value) || value <= 0) return;
              var scores = loadPastScores();
              scores.unshift(Math.floor(value));
              scores = scores.slice(0, 20);
              try { localStorage.setItem(SCORES_KEY, JSON.stringify(scores)); } catch (e) {}
          }

          // Save every finished run (on death) into the localStorage cache.
          if (typeof window.die === 'function') {
              var originalDie = window.die;
              window.die = function() {
                  try {
                      if (typeof score !== 'undefined') savePastScore(score);
                  } catch (e) {}
                  return originalDie.apply(this, arguments);
              };
          }

          var PLAYER_NAMES = ['Nova','Blaze','Vortex','Pixel','Echo','Drift','Onyx','Zephyr','Kai','Rogue','Frost','Jett','Mira','Orion','Pulse','Raven','Slate','Turbo','Umbra','Volt','Wisp','Xeno','Yara','Zeke','Ash','Bolt','Cipher','Dash','Ember','Flint','Ghost','Halo','Ion','Jinx','Koda','Luna','Nyx','Opal','Pax','Quinn'];

          var DUMMY_BOARD = null;

          function buildDummyBoard() {
              if (DUMMY_BOARD) return DUMMY_BOARD;
              DUMMY_BOARD = [];
              var usedNames = {};
              var current = 1090;
              for (var i = 0; i < 100; i++) {
                  var name = '';
                  do {
                      name = PLAYER_NAMES[Math.floor(Math.random() * PLAYER_NAMES.length)] + Math.floor(Math.random() * 999);
                  } while (usedNames[name]);
                  usedNames[name] = true;
                  DUMMY_BOARD.push({ name: name, score: current });
                  current -= 3 + Math.floor(Math.random() * 9);
                  if (current < 5) current = 5;
              }
              return DUMMY_BOARD;
          }

          // Leaderboard (changelog modal): demo data competing with your own past scores.
          function renderChangelogLeaderboard() {
              var list = document.getElementById('changelog-leaderboard-list');
              if (!list) return;
              list.innerHTML = '';
              var entries = buildDummyBoard().map(function(e) {
                  return { name: e.name, score: e.score, you: false };
              });
              var pastScores = loadPastScores();
              if (pastScores.length > 0) {
                  entries.push({ name: PLAYER_NAME, score: Math.max.apply(null, pastScores), you: true });
              }
              entries.sort(function(a, b) { return b.score - a.score; });
              entries.forEach(function(entry, index) {
                  var row = document.createElement('div');
                  row.className = 'flex items-center justify-between text-base' + (entry.you ? ' text-white font-bold' : ((index + 1) <= 3 ? ' text-amber-300 font-medium' : ' text-neutral-300'));
                  if (entry.you) row.setAttribute('data-you', '1');
                  var left = document.createElement('span');
                  left.textContent = (index + 1) + '. ' + entry.name;
                  var right = document.createElement('span');
                  right.className = 'tabular-nums';
                  right.textContent = entry.score;
                  row.appendChild(left);
                  row.appendChild(right);
                  list.appendChild(row);
              });
              var youRow = list.querySelector('[data-you="1"]');
              if (youRow && typeof youRow.scrollIntoView === 'function') {
                  youRow.scrollIntoView({ block: 'center' });
              }
          }

          function renderPastScores() {
              var list = document.getElementById('past-scores-list');
              if (!list) return;
              list.innerHTML = '';
              var scores = loadPastScores();
              if (scores.length === 0) {
                  var empty = document.createElement('p');
                  empty.className = 'text-neutral-500';
                  empty.textContent = 'No scores yet - play a run!';
                  list.appendChild(empty);
                  return;
              }
              scores.forEach(function(value, index) {
                  var row = document.createElement('div');
                  row.className = 'flex items-center justify-between';
                  var left = document.createElement('span');
                  left.textContent = (index + 1) + '. ' + PLAYER_NAME;
                  var right = document.createElement('span');
                  right.className = 'tabular-nums text-white font-medium';
                  right.textContent = value;
                  row.appendChild(left);
                  row.appendChild(right);
                  list.appendChild(row);
              });
          }

          var scoresModal = document.getElementById('scores-modal');
          var btnOpenScores = document.getElementById('btn-open-scores');
          var btnCloseScores = document.getElementById('btn-close-scores');

          if (scoresModal) {
              scoresModal.addEventListener('mousedown', function(e) { e.stopPropagation(); });
              scoresModal.addEventListener('touchstart', function(e) { e.stopPropagation(); });
          }
          if (btnOpenScores) {
              btnOpenScores.addEventListener('click', function(e) {
                  e.stopPropagation();
                  renderPastScores();
                  scoresModal.classList.remove('hidden');
              });
          }
          if (btnCloseScores) {
              btnCloseScores.addEventListener('click', function(e) {
                  e.stopPropagation();
                  scoresModal.classList.add('hidden');
              });
          }

          var btnOpenChangelog = document.getElementById('btn-open-changelog');
          if (btnOpenChangelog) {
              btnOpenChangelog.addEventListener('click', function() {
                  renderChangelogLeaderboard();
              });
          }

          window.addEventListener('keydown', function(e) {
              if ((e.code === 'Space' || e.code === 'ArrowUp') && scoresModal && !scoresModal.classList.contains('hidden')) {
                  e.stopPropagation();
              }
          }, true);

          // Reveal the Autoplay Bot option only after pressing Ctrl three times.
          var autoplayRow = document.getElementById('autoplay-row');
          var ctrlPresses = 0;
          var lastCtrlTime = 0;
          window.addEventListener('keydown', function(e) {
              if (e.key === 'Control' && !e.repeat) {
                  var now = performance.now();
                  if (now - lastCtrlTime > 1500) ctrlPresses = 0;
                  lastCtrlTime = now;
                  ctrlPresses++;
                  if (ctrlPresses >= 3 && autoplayRow) {
                      autoplayRow.style.display = '';
                  }
              }
          });

          // Hide the Autoplay Bot option again once it is switched on/off.
          var autoplayToggle = document.getElementById('toggle-autoplay-pause');
          if (autoplayToggle) {
              autoplayToggle.addEventListener('change', function() {
                  ctrlPresses = 0;
                  lastCtrlTime = 0;
                  if (autoplayRow) autoplayRow.style.display = 'none';
              });
          }
      })();
    </script>
